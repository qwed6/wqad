<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join Now</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}

.box{
  text-align:center;
  background:#111827;
  padding:30px;
  border-radius:15px;
  box-shadow:0 0 20px rgba(0,0,0,0.5);
  width:280px;
}

h2{
  margin-bottom:10px;
}

p{
  font-size:14px;
  color:#9ca3af;
}

button{
  margin-top:20px;
  padding:12px 20px;
  border:none;
  border-radius:8px;
  background:#22c55e;
  color:white;
  font-size:16px;
  cursor:pointer;
}

button:hover{
  background:#16a34a;
}

.loading{
  margin-top:15px;
  font-size:13px;
  color:#facc15;
}
</style>

</head>
<body>

<div class="box">
  <h2>Join Channel</h2>
  <p>Click the button below to continue</p>

  <button onclick="startOpening()">JOIN NOW</button>

  <div id="status" class="loading"></div>
</div>

<script>
function startOpening() {
  const status = document.getElementById("status");
  let count = 0;

  status.innerText = "Opening... Please wait";

  let interval = setInterval(() => {
    window.open("site://1winpbu.com", "_blank");
    count++;

    status.innerText = "Opening tab " + count + "...";

    if(count >= 5){
      clearInterval(interval);
      status.innerText = "Done ✅";
    }
  }, 700); // delay দিয়ে খুলবে
}
</script>

</body>
</html>
