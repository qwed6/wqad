<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>4 Iframe View</title>

  <style>
    body{
      margin:0;
      background:#111;
      font-family:Arial, sans-serif;
    }

    .container{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      padding:10px;
      height:100vh;
      box-sizing:border-box;
    }

    .frame-box{
      background:#000;
      border:2px solid #333;
      border-radius:10px;
      overflow:hidden;
    }

    iframe{
      width:100%;
      height:100%;
      border:none;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="frame-box">

    </div>
